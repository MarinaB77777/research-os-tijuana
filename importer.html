<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convertidor Universal de Cuestionarios | Research OS</title>
  
  <!-- Bibliotecas locales: el importador funciona sin conexión a Internet -->
  <script src="vendor/mammoth.browser.min.js"></script>
  <script src="vendor/pdf.min.js"></script>
  <script src="vendor/js-yaml.min.js"></script>
  <script src="vendor/jszip.min.js"></script>
  <script src="question-bank-import.js"></script>
  <script src="question-bank-file-reader.js"></script>
  <script src="research-contracts.js"></script>

  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #162032;
      --accent-color: #38bdf8;
      --accent-hover: #0ea5e9;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155; /* Сделали контуры более заметными */
      --error-bg: rgba(239, 68, 68, 0.15);
      --error-color: #f87171;
      --success-bg: rgba(16, 185, 129, 0.15);
      --success-color: #34d399;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      max-width: 1200px;
      width: 100%;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      border: 2px solid var(--border-color); /* Увеличена четкость главной рамки */
      padding: 24px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 16px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .hub-btn {
      background: #1e293b;
      color: var(--text-color);
      padding: 6px 12px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--border-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .hub-btn:hover { background: #334155; }

    .brand-title {
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.95rem;
    }

    .lang-selector {
      display: flex;
      gap: 6px;
    }

    .lang-selector button {
      background: #1e293b;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .lang-selector button:hover {
      color: var(--text-color);
      border-color: var(--accent-color);
    }

    .lang-selector button.active {
      background: var(--accent-color);
      color: #0f172a;
      border-color: var(--accent-color);
    }

    .page-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h1 {
      font-size: 1.4rem;
      margin: 0;
      color: var(--text-color);
    }

    .workspace {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      align-items: stretch;
    }

    @media (max-width: 768px) {
      .workspace { grid-template-columns: 1fr; }
    }

    .panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #0f172a; /* Сделали внутренние панели контрастнее подложки */
      border: 2px solid var(--border-color); /* Четкий видимый контур окон */
      border-radius: 10px;
      padding: 16px;
      box-sizing: border-box;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 36px;
    }

    label { font-weight: 600; font-size: 0.9rem; color: var(--text-muted); }

    textarea {
      width: 100%;
      height: 280px;
      font-family: "Consolas", "Courier New", Courier, monospace;
      font-size: 0.85rem;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-sizing: border-box;
      resize: vertical;
      background: #090d16; /* Глубокий цвет текстаовой зоны для контраста */
      color: #e2e8f0;
      line-height: 1.5;
      scrollbar-width: auto;
      scrollbar-color: var(--accent-color) #111827;
    }

    /* Настройка явных, видимых скроллбаров */
    textarea::-webkit-scrollbar {
      width: 14px;
      height: 14px;
    }
    textarea::-webkit-scrollbar-track {
      background: #111827;
      border: 1px solid #334155;
      border-radius: 8px;
    }
    textarea::-webkit-scrollbar-thumb {
      background: var(--accent-color);
      border-radius: 8px;
      border: 3px solid #111827;
    }
    textarea::-webkit-scrollbar-thumb:hover {
      background: #7dd3fc;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent-color);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }

    .import-editor {
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px;
      background: #090d16;
    }

    .import-editor-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .import-editor-grid .wide { grid-column: 1 / -1; }
    .import-editor-grid .half { grid-column: span 2; }

    .import-editor input,
    .import-editor select,
    .import-editor textarea {
      width: 100%;
      box-sizing: border-box;
      margin-top: 5px;
      padding: 7px 9px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: #0f172a;
      color: var(--text-color);
      font: inherit;
    }

    .import-editor textarea {
      height: auto;
      min-height: 56px;
      resize: vertical;
    }

    .import-editor input:focus,
    .import-editor select:focus,
    .import-editor textarea:focus {
      outline: none;
      border-color: var(--accent-color);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.16);
    }

    .import-identity {
      margin-bottom: 10px;
      color: var(--text-muted);
      font: 11px "Consolas", "Courier New", monospace;
      overflow-wrap: anywhere;
    }

    .import-diagnostic {
      margin-top: 7px;
      color: var(--error-color);
      font-size: 12px;
    }

    .preview-questions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 500px;
      overflow: auto;
      padding-right: 6px;
      scrollbar-width: auto;
      scrollbar-color: var(--accent-color) #111827;
    }

    .preview-questions::-webkit-scrollbar {
      width: 14px;
    }

    .preview-questions::-webkit-scrollbar-track {
      background: #111827;
      border: 1px solid #334155;
      border-radius: 8px;
    }

    .preview-questions::-webkit-scrollbar-thumb {
      background: var(--accent-color);
      border: 3px solid #111827;
      border-radius: 8px;
    }

    .preview-questions::-webkit-scrollbar-thumb:hover {
      background: #7dd3fc;
    }

    @media (max-width: 820px) {
      .import-editor-grid { grid-template-columns: 1fr 1fr; }
      .import-editor-grid .half { grid-column: 1 / -1; }
    }

    @media (max-width: 520px) {
      .import-editor-grid { grid-template-columns: 1fr; }
      .import-editor-grid .half,
      .import-editor-grid .wide { grid-column: 1; }
    }

    .controls {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    button.btn {
      background-color: var(--accent-color);
      color: #0f172a;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button.btn:hover { background-color: var(--accent-hover); }

    button.btn-secondary {
      background-color: #1e293b;
      color: var(--text-color);
      border: 1px solid var(--border-color);
    }

    button.btn-secondary:hover { background-color: #334155; }

    .file-input-wrapper input[type="file"] { display: none; }

    .status-bar {
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      display: none;
    }

    .status-bar.error {
      display: block;
      background-color: var(--error-bg);
      color: var(--error-color);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .status-bar.success {
      display: block;
      background-color: var(--success-bg);
      color: var(--success-color);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .app-signature {
      text-align: center;
      margin-top: 10px;
      padding-top: 16px;
      border-top: 2px solid var(--border-color);
      color: var(--text-muted);
      font-size: 13px;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-left">
      <a href="index.html" class="hub-btn" id="ui-back-hub">← Volver al inicio</a>
      <span class="brand-title">Research OS</span>
    </div>
    <div class="lang-selector">
      <button onclick="setLanguage('es')" id="lang-es" class="active">🇲🇽 ES</button>
      <button onclick="setLanguage('en')" id="lang-en">🇺🇸 EN</button>
      <button onclick="setLanguage('ru')" id="lang-ru">🇷🇺 RU</button>
    </div>
  </header>

  <div class="page-title-row">
    <span style="font-size: 1.5rem;">🔄</span>
    <h1 id="ui-title">Convertidor Universal de Cuestionarios</h1>
  </div>

  <div class="workspace">
    <div class="panel">
      <div class="panel-header">
        <label for="input-json" id="ui-input-label">Encuesta Fuente (DOCX, PDF, XLSX, XML, CSV, YAML, TXT, JSON, PY, PAGES):</label>
        <div class="file-input-wrapper">
          <input type="file" id="file-loader" accept=".docx,.pdf,.xlsx,.xls,.xml,.csv,.yml,.yaml,.txt,.json,.py,.js,.pages" onchange="handleFileSelect(event)">
          <button class="btn btn-secondary" onclick="document.getElementById('file-loader').click()" id="ui-btn-upload">📂 Cargar Archivo</button>
        </div>
      </div>
      <textarea id="input-json" placeholder="Cargue un archivo o pegue los datos del cuestionario..." data-placeholder-key="inputPlaceholder"></textarea>
    </div>

    <div class="panel">
      <div class="panel-header">
        <label for="output-json" id="ui-output-label">Resultado (Canonical Schema + UUID):</label>
      </div>
      <textarea id="output-json" readonly placeholder="Espere el resultado..." data-placeholder-key="outputPlaceholder"></textarea>
    </div>
  </div>

  <div id="status-message" class="status-bar"></div>
  <div id="import-preview" class="panel" style="display:none">
    <div class="panel-header">
      <label id="ui-preview-label">Vista previa del reconocimiento</label>
    </div>
    <div id="preview-summary" style="margin-bottom:12px;color:var(--text-muted)"></div>
    <div id="preview-bank"></div>
    <div id="preview-questions" class="preview-questions"></div>
    <div id="preview-diagnostics" style="margin-top:12px"></div>
  </div>

  <div class="controls">
    <button class="btn btn-secondary" onclick="clearAll()" id="ui-btn-clear">Limpiar</button>
    <button class="btn btn-secondary" onclick="copyResult()" id="ui-btn-copy">Copiar Resultado</button>
    <button class="btn" onclick="processConversion()" id="ui-btn-convert">Convertir</button>
    <button class="btn" onclick="saveAndUseInQuestionnaireConstructor()" id="ui-btn-use" style="display:none">Guardar banco y usarlo en el constructor</button>
  </div>

  <div class="app-signature">
    <span>✨ CRM Sharks · Ray | Research OS Pilot</span>
  </div>
</div>

    copyFailed: "Браузер не разрешил скопировать результат.",
    pdfLibraryMissing: "Библиотека PDF.js не загружена.",
    zipLibraryMissing: "Библиотека JSZip не загружена.",
    diagnostics: {
      INVALID_SCHEMA: "Требуется схема research_os.question_bank версии 2.",
      INVALID_BANK_ID: "Требуется корректный UUID банка.",
      MISSING_BANK_TITLE: "Импортированному банку нужно название.",
      MISSING_BANK_CODE: "Импортированному банку нужен код.",
      MISSING_PRIMARY_LANGUAGE: "Выберите основной язык содержания.",
      INVALID_GLOBAL_TIME_REFERENCE: "Требуется корректная глобальная временная привязка.",
      INVALID_QUESTION_COLLECTION: "Необходимы questions и question_order.",
      EMPTY_QUESTION_BANK: "Банк должен содержать хотя бы один вопрос.",
      MISSING_QUESTION: "Вопрос отсутствует в questions.",
      DUPLICATE_ORDER: "Вопрос повторяется в question_order.",
      INVALID_QUESTION_ID: "Требуется корректный UUID вопроса.",
      CODE_MISMATCH: "Ключ и код вопроса не совпадают.",
      MISSING_PROMPT: "Отсутствует текст вопроса.",
      PLACEHOLDER_PROMPT: "Вопрос всё ещё содержит незавершённый временный текст.",
      UNRESOLVED_TYPE: "Перед регистрацией вопроса выберите тип ответа.",
      INVALID_TYPE: "Этот тип ответа не поддерживается модулем проведения анкет.",
      UNRESOLVED_SCALE: "Перед регистрацией вопроса выберите контракт шкалы.",
      UNRESOLVED_PSYCHOMETRIC_LEVEL: "Перед регистрацией вопроса выберите психометрический уровень.",
      INVALID_PSYCHOMETRIC_LEVEL: "Этот психометрический уровень не поддерживается контрактом анализа.",
      INVALID_OPTIONS: "Варианты ответа должны быть массивом.",
      MISSING_OPTIONS: "Для вопроса с выбором нужны как минимум два варианта ответа.",
      INVALID_OPTION: "У каждого варианта должен быть текст.",
      MISSING_OPTION_VALUE: "У каждого варианта должно быть стабильное уникальное значение.",
      DUPLICATE_OPTION_VALUE: "Значения вариантов ответа должны быть уникальными.",
      QUESTION_ROUTING: "Настройте переходы в конструкторе анкеты.",
      NORMALIZED_CODE_COLLISION: "Вопрос сохранён под уникальным кодом: два исходных кода совпали после нормализации.",
      INVALID_STATUS: "Статус должен быть draft, trial или active.",
      UNORDERED_QUESTION: "Вопрос не включён в question_order."
    }
  });

  let currentLang = 'es';
  let currentSourceFormat = 'text';
  let currentSourceTitle = '';
  let currentParsedValue = null;
  let currentInputKind = 'structured';
  let currentImportResult = null;

  function setLanguage(lang) {
    currentLang = lang;
    localStorage.setItem('app_language', lang);
    document.documentElement.lang = lang === 'es' ? 'es-MX' : lang === 'en' ? 'en-US' : 'ru-RU';
    document.querySelectorAll('.lang-selector button').forEach(btn => btn.classList.remove('active'));
    document.getElementById(`lang-${lang}`).classList.add('active');

    const t = i18n[lang];
    document.title = `${t.title} | Research OS`;
    document.getElementById('ui-title').innerText = t.title;
    document.getElementById('ui-back-hub').innerText = t.backHub;
    document.getElementById('ui-input-label').innerText = t.inputLabel;
    document.getElementById('ui-output-label').innerText = t.outputLabel;
    document.getElementById('ui-preview-label').innerText = t.previewLabel;
    document.getElementById('ui-btn-upload').innerText = t.btnUpload;
    document.getElementById('ui-btn-clear').innerText = t.btnClear;
    document.getElementById('ui-btn-copy').innerText = t.btnCopy;
    document.getElementById('ui-btn-convert').innerText = t.btnConvert;
    document.getElementById('ui-btn-use').innerText = t.btnUse;
    document.querySelectorAll('[data-placeholder-key]').forEach(element => {
      element.placeholder = t[element.dataset.placeholderKey];
    });
    if (currentImportResult) {
      renderImportPreview(currentImportResult);
      showStatus(
        currentImportResult.can_use ? t.msgSuccess : t.needsResolution,
        !currentImportResult.can_use
      );
    }
  }

  function primaryLanguageFrom(text) {
    const value = String(text || '');
    if (/[А-Яа-яЁё]/.test(value)) return 'ru-RU';
    if (/[¿¡ñÑáéíóúüÁÉÍÓÚÜ]/.test(value) || /\b(?:que|cu[aá]l|c[oó]mo|d[oó]nde|usted|respuesta)\b/i.test(value)) {
      return 'es-MX';
    }
    if (/\b(?:what|which|how|where|when|answer|select|choose)\b/i.test(value)) return 'en-US';
    return currentLang === 'ru' ? 'ru-RU' : currentLang === 'en' ? 'en-US' : 'es-MX';
  }

  async function handleFileSelect(event) {
    const fileInput = event.target;
    const file = fileInput.files[0];
    if (!file) return;

    showStatus(i18n[currentLang].readingFile, false);
    const inputArea = document.getElementById('input-json');
    invalidateConvertedState();
    currentParsedValue = null;
    currentInputKind = 'structured';

    try {
      const result = await QuestionBankFileReader.readQuestionnaireFile(file);
      currentSourceFormat = result.extension;
      currentSourceTitle = result.source_title;
      currentParsedValue = result.parsed_value;
      currentInputKind = result.input_kind;
      inputArea.value = result.content;
      fileInput.value = "";

      processConversion();

    } catch (err) {
      invalidateConvertedState();
      showStatus(`⚠️ ${err.message}`, true);
      fileInput.value = "";
    }
  }

  function showStatus(message, isError = false) {
    const statusBar = document.getElementById('status-message');
    statusBar.className = `status-bar ${isError ? 'error' : 'success'}`;
    statusBar.innerText = message;
  }

  function processConversion() {
    const inputArea = document.getElementById('input-json');
    const outputArea = document.getElementById('output-json');

    let rawText = (inputArea.value || "").trim();
    invalidateConvertedState();

    if (!rawText) {
      showStatus(i18n[currentLang].errEmpty, true);
      return;
    }

    try {
      const metadata = {
        title: currentSourceTitle || '',
        primary_language: primaryLanguageFrom(rawText),
        interface_language: currentLang
      };
      let canonicalResult;
      if (currentInputKind === 'plain') {
        canonicalResult = QuestionBankImport.plainTextToQuestionBank(rawText, metadata);
      } else {
        try {
          const parsedData = QuestionBankImport.parseStructuredText(rawText, value =>
              typeof jsyaml !== 'undefined' ? jsyaml.load(value) : null
            );
          canonicalResult = QuestionBankImport.canonicalOrConverted(parsedData, metadata);
        } catch (structuredError) {
          if (currentInputKind !== 'auto' && !QuestionBankImport.mayFallbackToPlainText(currentSourceFormat)) {
            throw structuredError;
          }
          canonicalResult = QuestionBankImport.plainTextToQuestionBank(rawText, metadata);
          currentInputKind = 'plain';
        }
      }
      currentImportResult = QuestionBankImport.summarize(canonicalResult, currentSourceFormat);
      outputArea.value = JSON.stringify(canonicalResult, null, 2);
      renderImportPreview(currentImportResult);
      showStatus(
        currentImportResult.can_use ? i18n[currentLang].msgSuccess : i18n[currentLang].needsResolution,
        !currentImportResult.can_use
      );
    } catch (e) {
      invalidateConvertedState();
      showStatus(`${i18n[currentLang].conversionError}: ${e.message}`, true);
    }
  }

  function invalidateConvertedState() {
    currentImportResult = null;
    document.getElementById('output-json').value = '';
    renderImportPreview(null);
  }

  function renderImportPreview(result) {
    const preview = document.getElementById('import-preview');
    const useButton = document.getElementById('ui-btn-use');
    if (!result) {
      preview.style.display = 'none';
      useButton.style.display = 'none';
      return;
    }
    const t = i18n[currentLang];
    preview.style.display = 'block';
    useButton.style.display = '';
    useButton.disabled = !result.can_use;
    document.getElementById('preview-summary').textContent =
      `${result.bank.title || '—'} · ${result.counts.questions} ${t.questions} · ${result.counts.errors} ${t.errors}. ${t.editHelp}`;

    const bankEditor = document.getElementById('preview-bank');
    bankEditor.innerHTML = '';
    const bankCard = document.createElement('div');
    bankCard.className = 'import-editor';
    bankCard.style.marginBottom = '10px';
    const bankIdentity = document.createElement('div');
    bankIdentity.className = 'import-identity';
    bankIdentity.textContent = `bank UUID: ${result.bank.bank_id} · v${result.bank.version}`;
    const bankGrid = document.createElement('div');
    bankGrid.className = 'import-editor-grid';
    bankGrid.append(
      editorField(t.bankTitle, textInput(result.bank.title, value => {
        const previousTitleCode = normalizeEditorCode(result.bank.title, '');
        result.bank.title = value.trim();
        if (!result.bank.code || result.bank.code === previousTitleCode) {
          result.bank.code = normalizeEditorCode(result.bank.title, '');
        }
        refreshImportResult();
      }), 'half'),
      editorField(t.primaryLanguage, selectInput([
        ['es-MX', 'Español (México)'],
        ['en-US', 'English (United States)'],
        ['ru-RU', 'Русский']
      ], result.bank.primary_language || primaryLanguageFrom(''), value => {
        result.bank.primary_language = value;
        refreshImportResult();
      }), 'half')
    );
    const bankAdvanced = detailsSection(t.advancedFields, [
      editorField(t.bankCode, textInput(result.bank.code, value => {
        result.bank.code = normalizeEditorCode(value, '');
        refreshImportResult();
      }), 'half')
    ]);
    bankCard.append(bankIdentity, bankGrid, bankAdvanced);
    bankEditor.appendChild(bankCard);

    const questions = document.getElementById('preview-questions');
    questions.innerHTML = '';
    result.bank.question_order.forEach((questionCode, index) => {
      const question = result.bank.questions[questionCode];
      const errors = result.diagnostics.filter(item => item.question_code === questionCode);
      const row = document.createElement('div');
      row.className = 'import-editor';
      const identity = document.createElement('div');
      identity.className = 'import-identity';
      identity.textContent = `${index + 1}. UUID: ${question.question_id} · v${question.version}`;
      const grid = document.createElement('div');
      grid.className = 'import-editor-grid';

      const typeSelect = selectInput([
        ['', t.emptyChoice],
        ['single_select', 'single_select'],
        ['multiple_select', 'multiple_select'],
        ['numeric_input', 'numeric_input'],
        ['text_input', 'text_input']
      ], question.type || '', value => {
        const inferred = QuestionBankImport.inferQuestionContract({ ...question, type: value || null });
        question.type = inferred.type;
        question.scale = inferred.scale;
        refreshImportResult();
      });
      const levelSelect = selectInput([
        ['', t.emptyChoice],
        ['nominal', 'nominal'],
        ['ordinal', 'ordinal'],
        ['interval_ratio', 'interval_ratio'],
        ['textual', 'textual']
      ], question.scale?.psychometric_level || '', value => {
        ensureScale(question).psychometric_level = value || null;
        refreshImportResult();
      });
      const statusSelect = selectInput([
        ['draft', 'Draft'],
        ['trial', 'Trial'],
        ['active', 'Active']
      ], question.status || 'draft', value => {
        question.status = value;
        refreshImportResult();
      });
      const options = (question.options || [])
        .map((option, optionIndex) =>
          `${option.value ?? optionIndex + 1} | ${option.text ?? ''}`
        )
        .join('\n');

      grid.append(
        editorField(t.prompt, areaInput(question.prompt, value => {
          question.prompt = value.trim();
          refreshImportResult();
        }), 'wide'),
        editorField(t.responseType, typeSelect)
      );
      if (question.type || question.scale) {
        grid.append(
          editorField(t.scaleId, textInput(question.scale?.id || '', value => {
          ensureScale(question).id = value.trim() || null;
          refreshImportResult();
          })),
          editorField(t.psychometricLevel, levelSelect)
        );
      }
      if (['single_select', 'multiple_select'].includes(question.type) || question.options?.length) {
        grid.append(editorField(t.options, areaInput(options, value => {
          question.options = parseEditedOptions(value);
          const inferred = QuestionBankImport.inferQuestionContract(question);
          question.type = question.type || inferred.type;
          question.scale = inferred.scale;
          refreshImportResult();
        }), 'wide'));
      }
      const rangeRelevant = question.type === 'numeric_input' ||
        question.scale?.psychometric_level === 'ordinal' ||
        [question.scale?.min, question.scale?.max, question.scale?.step].some(value => value !== null && value !== undefined);
      if (rangeRelevant) {
        grid.append(
          editorField(t.min, numberInput(question.scale?.min, value => {
          ensureScale(question).min = numberOrNull(value);
          refreshImportResult();
          })),
          editorField(t.max, numberInput(question.scale?.max, value => {
          ensureScale(question).max = numberOrNull(value);
          refreshImportResult();
          })),
          editorField(t.step, numberInput(question.scale?.step, value => {
          ensureScale(question).step = numberOrNull(value);
          refreshImportResult();
          })),
          editorField(t.unit, textInput(question.scale?.unit || '', value => {
            ensureScale(question).unit = value.trim() || null;
            refreshImportResult();
          }))
        );
      }
      const advanced = detailsSection(t.advancedFields, [
        editorField(t.questionCode, textInput(question.code, value => {
          renameImportedQuestion(questionCode, value);
        })),
        editorField(t.status, statusSelect),
        ...(!rangeRelevant ? [editorField(t.unit, textInput(question.scale?.unit || '', value => {
          ensureScale(question).unit = value.trim() || null;
          refreshImportResult();
        }))] : []),
        editorField(t.scaleDirection, textInput(question.scale?.direction || '', value => {
          ensureScale(question).direction = value.trim() || null;
          refreshImportResult();
        })),
        editorField(t.scoreDirection, textInput(question.score_direction || '', value => {
          question.score_direction = value.trim() || null;
          refreshImportResult();
        })),
        editorField(t.trackingMode, selectInput([
          ['', t.emptyChoice],
          ['time_invariant', 'time_invariant'],
          ['time_variant', 'time_variant']
        ], question.time?.tracking_mode || '', value => {
          ensureTime(question).tracking_mode = value || null;
          refreshImportResult();
        })),
        editorField(t.wave, textInput(question.time?.wave || '', value => {
          ensureTime(question).wave = value.trim() || null;
          refreshImportResult();
        })),
        editorField(t.lag, textInput(question.time?.lag || '', value => {
          ensureTime(question).lag = value.trim() || null;
          refreshImportResult();
        })),
        editorField(t.block, textInput(question.block || '', value => {
          question.block = value.trim() || null;
          refreshImportResult();
        })),
        editorField(t.family, textInput(question.family || '', value => {
          question.family = value.trim() || null;
          refreshImportResult();
        })),
        editorField(t.domain, textInput(question.domain || '', value => {
          question.domain = value.trim() || null;
          refreshImportResult();
        })),
        editorField(t.parameter, textInput(question.parameter || '', value => {
          question.parameter = value.trim() || null;
          refreshImportResult();
        }))
      ]);
      row.append(identity, grid, advanced);
      errors.forEach(item => {
        const error = document.createElement('div');
        error.className = 'import-diagnostic';
        error.textContent = localizeDiagnostic(item);
        row.appendChild(error);
      });
      questions.appendChild(row);
    });
    const diagnostics = document.getElementById('preview-diagnostics');
    diagnostics.innerHTML = '';
    result.diagnostics.filter(item => !item.question_code).forEach(item => {
      const line = document.createElement('div');
      line.style.color = item.level === 'error' ? 'var(--error-color)' : 'var(--text-muted)';
      line.textContent = localizeDiagnostic(item);
      diagnostics.appendChild(line);
    });
  }

  function localizeDiagnostic(item) {
    return i18n[currentLang].diagnostics?.[item.code] || item.message;
  }

  function editorField(label, control, className = '') {
    const wrapper = document.createElement('label');
    wrapper.className = className;
    const caption = document.createElement('span');
    caption.textContent = label;
    wrapper.append(caption, control);
    return wrapper;
  }

  function detailsSection(label, fields) {
    const details = document.createElement('details');
    details.style.marginTop = '12px';
    const summary = document.createElement('summary');
    summary.textContent = label;
    summary.style.cursor = 'pointer';
    const grid = document.createElement('div');
    grid.className = 'import-editor-grid';
    grid.style.marginTop = '12px';
    grid.append(...fields);
    details.append(summary, grid);
    return details;
  }

  function textInput(value, onChange) {
    const input = document.createElement('input');
    input.type = 'text';
    input.value = value ?? '';
    input.addEventListener('change', () => onChange(input.value));
    return input;
  }

  function numberInput(value, onChange) {
    const input = document.createElement('input');
    input.type = 'number';
    input.step = 'any';
    input.value = value ?? '';
    input.addEventListener('change', () => onChange(input.value));
    return input;
  }

  function areaInput(value, onChange) {
    const area = document.createElement('textarea');
    area.value = value ?? '';
    area.addEventListener('change', () => onChange(area.value));
    return area;
  }

  function selectInput(options, value, onChange) {
    const select = document.createElement('select');
    options.forEach(([optionValue, text]) => {
      const option = document.createElement('option');
      option.value = optionValue;
      option.textContent = text;
      option.selected = optionValue === value;
      select.appendChild(option);
    });
    select.addEventListener('change', () => onChange(select.value));
    return select;
  }

  function ensureScale(question) {
    if (!question.scale || typeof question.scale !== 'object' || Array.isArray(question.scale)) {
      question.scale = {
        id: null,
        psychometric_level: null,
        min: null,
        max: null,
        step: null,
        unit: null,
        direction: null
      };
    }
    return question.scale;
  }

  function ensureTime(question) {
    if (!question.time || typeof question.time !== 'object' || Array.isArray(question.time)) {
      question.time = { tracking_mode: null, wave: null, lag: null };
    }
    return question.time;
  }

  function numberOrNull(value) {
    if (value === '' || value === null || value === undefined) return null;
    const number = Number(value);
    return Number.isFinite(number) ? number : null;
  }

  function normalizeEditorCode(value, fallback) {
    const normalized = String(value || '')
      .normalize('NFKD')
      .replace(/[\u0300-\u036f]/g, '')
      .toUpperCase()
      .replace(/[^A-Z0-9]+/g, '_')
      .replace(/^_+|_+$/g, '');
    return normalized || fallback;
  }

  function parseEditedOptions(value) {
    return String(value || '')
      .split(/\r?\n/)
      .map(line => line.trim())
      .filter(Boolean)
      .map((line, index) => {
        const separator = line.indexOf('|');
        if (separator < 0) return { value: index + 1, text: line };
        const rawValue = line.slice(0, separator).trim();
        const numericValue = numberOrNull(rawValue);
        return {
          value: numericValue === null ? rawValue : numericValue,
          text: line.slice(separator + 1).trim()
        };
      });
  }

  function renameImportedQuestion(oldCode, requestedCode) {
    const bank = currentImportResult?.bank;
    if (!bank?.questions?.[oldCode]) return;
    const newCode = normalizeEditorCode(requestedCode, oldCode);
    if (newCode !== oldCode && bank.questions[newCode]) {
      showStatus(i18n[currentLang].duplicateCode.replace('{code}', newCode), true);
      renderImportPreview(currentImportResult);
      return;
    }
    if (newCode !== oldCode) {
      const question = bank.questions[oldCode];
      delete bank.questions[oldCode];
      question.code = newCode;
      bank.questions[newCode] = question;
      bank.question_order = bank.question_order.map(code => code === oldCode ? newCode : code);
    }
    refreshImportResult();
  }

  function refreshImportResult() {
    if (!currentImportResult?.bank) return;
    currentImportResult = QuestionBankImport.summarize(
      currentImportResult.bank,
      currentSourceFormat
    );
    document.getElementById('output-json').value =
      JSON.stringify(currentImportResult.bank, null, 2);
    renderImportPreview(currentImportResult);
    showStatus(
      currentImportResult.can_use ? i18n[currentLang].msgSuccess : i18n[currentLang].needsResolution,
      !currentImportResult.can_use
    );
  }

  async function saveAndUseInQuestionnaireConstructor() {
    if (!currentImportResult?.can_use) return;
    const button = document.getElementById('ui-btn-use');
    button.disabled = true;
    try {
      const token = ResearchContracts.researcherToken();
      if (!token) throw new Error('Researcher login is required to register an imported question bank.');
      await ResearchContracts.requestJson('/question-banks/save', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify(currentImportResult.bank)
      });
      sessionStorage.setItem('research_os.imported_question_bank.v1', JSON.stringify(currentImportResult.bank));
      const params = new URLSearchParams(window.location.search);
      const destination = params.get('return') || 'constructor_survey.html';
      const safeDestination = /^[A-Za-z0-9_.-]+(?:\?[A-Za-z0-9_.=&%-]*)?$/.test(destination)
        ? destination
        : 'constructor_survey.html';
      window.location.href = safeDestination;
    } catch (error) {
      showStatus(error.message, true);
      button.disabled = false;
    }
  }

  function clearAll() {
    document.getElementById('input-json').value = '';
    document.getElementById('output-json').value = '';
    document.getElementById('file-loader').value = '';
    document.getElementById('status-message').style.display = 'none';
    currentSourceFormat = 'text';
    currentSourceTitle = '';
    currentParsedValue = null;
    currentInputKind = 'structured';
    currentImportResult = null;
    renderImportPreview(null);
  }

  async function copyResult() {
    const outputArea = document.getElementById('output-json');
    if (outputArea.value) {
      try {
        await navigator.clipboard.writeText(outputArea.value);
        showStatus(i18n[currentLang].msgCopied, false);
      } catch (_) {
        showStatus(i18n[currentLang].copyFailed, true);
      }
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('input-json').addEventListener('input', () => {
      currentParsedValue = null;
      currentInputKind = 'auto';
      invalidateConvertedState();
    });
    const saved = (localStorage.getItem('app_language') || 'es').replace('-MX', '').replace('-US', '');
    setLanguage(i18n[saved] ? saved : 'es');
  });
</script>
