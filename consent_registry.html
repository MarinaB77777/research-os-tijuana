<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Research OS · Consent Registry</title>
  <style>
    :root{--bg:#030a0c;--panel:#071419;--card:#0c1b21;--input:#050e12;--line:#1e3a45;--cyan:#06b6d4;--cyan2:#a5f3fc;--text:#ecfeff;--muted:#8faeb8;--bad:#f87171;--ok:#34d399}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    header{background:var(--input);border-bottom:2px solid var(--line);padding:12px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
    h1{font-size:14px;color:var(--cyan);letter-spacing:.5px;text-transform:uppercase;margin:0}h2{font-size:14px;color:var(--cyan);margin:0 0 14px}
    button,a{border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--input);color:var(--text);cursor:pointer;text-decoration:none;font-weight:700;font-size:12px}
    button.primary{background:var(--cyan);color:#031014;border-color:var(--cyan)}button:disabled,input:disabled,textarea:disabled,select:disabled{opacity:.55;cursor:not-allowed}
    select,input,textarea{width:100%;background:var(--input);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}textarea{min-height:320px;resize:vertical;line-height:1.55}
    label{display:block;color:var(--cyan2);font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;margin:0 0 6px}
    .layout{display:grid;grid-template-columns:minmax(280px,.8fr) minmax(440px,1.4fr);gap:14px;padding:14px;max-width:1200px;margin:auto}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}.field{margin-bottom:11px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .list{display:flex;flex-direction:column;gap:8px;max-height:72vh;overflow:auto}.entry{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:11px;cursor:pointer}.entry.active{border-color:var(--cyan)}
    .title{font-weight:800}.meta{font-size:11px;color:var(--muted);margin-top:5px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}
    .status{min-height:38px;margin-top:12px;padding:10px;border-radius:8px;background:var(--input);color:var(--muted);white-space:pre-wrap}.status.error{color:var(--bad);border:1px solid rgba(248,113,113,.45)}.status.ok{color:var(--ok);border:1px solid rgba(52,211,153,.4)}
    footer{text-align:center;color:#6e8790;padding:18px;font-size:12px}@media(max-width:850px){.layout{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header>
  <h1 data-i18n="title">Research OS · Registro de consentimientos</h1>
  <div class="row">
    <a href="index.html">⌂ Research OS</a>
    <a id="returnLink" href="constructor_survey.html" data-i18n="back">← Cuestionario</a>
    <select id="lang" style="width:auto" onchange="setLanguage(this.value)">
      <option value="es">🇲🇽 ES</option><option value="en">🇺🇸 EN</option><option value="ru">RU</option>
    </select>
  </div>
</header>
<main class="layout">
  <section class="panel">
    <div class="row" style="justify-content:space-between;margin-bottom:12px">
      <h2 data-i18n="registry">Base común</h2>
      <button onclick="newSpecialConsent()" data-i18n="new">＋ Especial</button>
    </div>
    <div id="consentList" class="list"></div>
  </section>
  <section class="panel">
    <h2 data-i18n="editor">Documento versionado</h2>
    <div class="field"><label data-i18n="name">Nombre</label><input id="name" oninput="onName()"></div>
    <div class="grid2">
      <div class="field"><label data-i18n="code">Código automático</label><input id="code" readonly></div>
      <div class="field"><label>UUID</label><input id="uuid" readonly></div>
    </div>
    <div class="grid2">
      <div class="field"><label data-i18n="version">Versión</label><input id="version" type="number" min="1" step="1" onchange="readForm()"></div>
      <div class="field"><label data-i18n="statusLabel">Estado</label><select id="status" onchange="readForm()"><option value="draft">Draft</option><option value="trial">Trial</option><option value="active">Active</option></select></div>
    </div>
    <div class="field">
      <label data-i18n="documentLanguage">Idioma del texto mostrado</label>
      <select id="textLanguage" onchange="switchTextLanguage(this.value)">
        <option value="es">Español</option><option value="en">English</option><option value="ru">Русский</option>
      </select>
    </div>
    <div class="field"><label data-i18n="text">Texto exacto del consentimiento</label><textarea id="documentText" oninput="saveCurrentText()"></textarea></div>
    <div class="row">
      <button onclick="newSpecialConsent()" data-i18n="new">Nuevo documento</button>
      <button onclick="createNextVersion()" data-i18n="nextVersion">Nueva versión</button>
      <button class="primary" onclick="saveConsent()" data-i18n="save">Guardar en BD</button>
    </div>
    <div id="statusBox" class="status"></div>
  </section>
</main>
<footer>✨ CRM Sharks &amp; Ray AI &amp; Gemini AI | Research OS Pilot</footer>
<script src="auth.js"></script>
<script src="research-contracts.js"></script>
<script>
'use strict';
const RC=window.ResearchContracts;
const I18N={
 es:{title:'Research OS · Registro de consentimientos',back:'← Cuestionario',registry:'Base común',new:'＋ Especial',editor:'Documento versionado',name:'Nombre',code:'Código automático',version:'Versión',statusLabel:'Estado',documentLanguage:'Idioma del texto mostrado',text:'Texto exacto del consentimiento',nextVersion:'Nueva versión',save:'Guardar en BD',saved:'Documento guardado.',standard:'Documento estándar del sistema (solo lectura)',emptyActive:'Un documento Active requiere texto en su idioma principal.'},
 en:{title:'Research OS · Consent Registry',back:'← Questionnaire',registry:'Shared registry',new:'＋ Special',editor:'Versioned document',name:'Name',code:'Automatic code',version:'Version',statusLabel:'Status',documentLanguage:'Displayed text language',text:'Exact consent text',nextVersion:'New version',save:'Save to DB',saved:'Document saved.',standard:'System standard document (read only)',emptyActive:'An Active document requires text in its primary language.'},
 ru:{title:'Research OS · Реестр согласий',back:'← К анкете',registry:'Общая база',new:'＋ Особое',editor:'Версионируемый документ',name:'Название',code:'Автоматический код',version:'Версия',statusLabel:'Статус',documentLanguage:'Язык отображаемого текста',text:'Точный текст согласия',nextVersion:'Новая версия',save:'Сохранить в БД',saved:'Документ сохранён.',standard:'Системный стандартный документ (только чтение)',emptyActive:'Для статуса Active нужен текст на основном языке.'}
};
let lang='es',catalog=[],textLanguage='es',state;
function blankState(){return {schema:'research_os.consent_document',schema_version:1,consent_id:RC.createUuid(),version:1,code:'SPECIAL_CONSENT',title:'',consent_kind:'special',status:'draft',primary_language:lang,texts:{es:'',en:'',ru:''},is_system:false,generated_at:RC.nowIso()};}
function setLanguage(value){
 lang=I18N[value]?value:'es';localStorage.setItem('app_language',lang);document.documentElement.lang=lang;document.getElementById('lang').value=lang;
 document.querySelectorAll('[data-i18n]').forEach(el=>{const value=I18N[lang][el.dataset.i18n];if(value)el.textContent=value;});
 renderCatalog();
}
function setStatus(message,type){const box=document.getElementById('statusBox');box.textContent=message||'';box.className=`status ${type||''}`;}
function onName(){state.title=document.getElementById('name').value;state.code=RC.normalizeCode(state.title,'SPECIAL_CONSENT');document.getElementById('code').value=state.code;}
function saveCurrentText(){if(state&&!state.is_system)state.texts[textLanguage]=document.getElementById('documentText').value;}
function readForm(){
 if(!state||state.is_system)return state;
 saveCurrentText();state.title=document.getElementById('name').value.trim();state.code=RC.normalizeCode(state.title,'SPECIAL_CONSENT');state.version=Number(document.getElementById('version').value);state.status=document.getElementById('status').value;state.primary_language=state.primary_language||textLanguage;state.generated_at=RC.nowIso();return state;
}
function renderForm(){
 const readonly=Boolean(state.is_system);document.getElementById('name').value=state.title||'';document.getElementById('code').value=state.code||'';document.getElementById('uuid').value=state.consent_id;document.getElementById('version').value=state.version;document.getElementById('status').value=state.status;document.getElementById('textLanguage').value=textLanguage;document.getElementById('documentText').value=state.texts?.[textLanguage]||'';
 ['name','version','status','documentText'].forEach(id=>document.getElementById(id).disabled=readonly);
 document.querySelector('button[onclick="saveConsent()"]').disabled=readonly;
 document.querySelector('button[onclick="createNextVersion()"]').disabled=readonly;
 if(readonly)setStatus(I18N[lang].standard,'');
}
function switchTextLanguage(value){saveCurrentText();textLanguage=value;document.getElementById('documentText').value=state.texts?.[textLanguage]||'';}
function newSpecialConsent(){state=blankState();textLanguage=lang;renderForm();renderCatalog();setStatus('','');}
function createNextVersion(){if(state.is_system)return;readForm();state={...state,version:Number(state.version)+1,status:'draft',generated_at:RC.nowIso()};renderForm();}
function renderCatalog(){
 const list=document.getElementById('consentList');list.innerHTML='';
 catalog.forEach(c=>{const el=document.createElement('div');el.className=`entry${state&&state.consent_id===c.consent_id&&Number(state.version)===Number(c.version)?' active':''}`;el.innerHTML=`<div class="title">${escapeHtml(c.title)}</div><div class="meta">${escapeHtml(c.code)} · v${c.version} · ${escapeHtml(c.status)} · ${escapeHtml(c.consent_kind)}</div>`;el.onclick=()=>openConsent(c);list.appendChild(el);});
}
async function loadCatalog(){
 try{const data=await RC.requestJson('/consents?status=all');catalog=data.consents||[];renderCatalog();}catch(error){setStatus(error.message,'error');}
}
async function openConsent(entry){
 try{const data=await RC.requestJson(`/consents/${encodeURIComponent(entry.consent_id)}?version=${entry.version}`);state=data.consent;state.texts=state.texts||{es:'',en:'',ru:''};textLanguage=state.primary_language||lang;renderForm();renderCatalog();}catch(error){setStatus(error.message,'error');}
}
async function saveConsent(){
 try{const payload=readForm();if(!payload.title)throw new Error('Name is required');if(!Number.isInteger(payload.version)||payload.version<1)throw new Error('Positive version is required');if(payload.status==='active'&&!String(payload.texts[payload.primary_language]||'').trim())throw new Error(I18N[lang].emptyActive);await RC.requestJson('/consents/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});setStatus(I18N[lang].saved,'ok');await loadCatalog();}catch(error){setStatus(error.message,'error');}
}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
document.addEventListener('DOMContentLoaded',async()=>{const session=await ResearchAuth.requireRole('researcher','consent_registry.html');if(!session)return;const params=new URLSearchParams(location.search);const returnTo=params.get('return');if(returnTo&&/^[A-Za-z0-9_.-]+$/.test(returnTo))document.getElementById('returnLink').href=returnTo;lang=(localStorage.getItem('app_language')||'es').replace('-MX','').replace('-US','');if(!I18N[lang])lang='es';state=blankState();textLanguage=lang;setLanguage(lang);renderForm();await loadCatalog();});
</script>
</body>
</html>
