<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Research OS | Dialogue</title><style>
:root{--bg:#0b0f19;--panel:#162032;--line:#334155;--text:#f8fafc;--muted:#94a3b8;--accent:#38bdf8;--bad:#fca5a5;--ok:#34d399}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}header{padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line)}.head,main{max-width:860px;margin:auto}.head{display:flex;justify-content:space-between;gap:10px;align-items:center}.brand{font-weight:800;color:var(--accent)}button,.button{border:0;border-radius:8px;padding:10px 14px;background:var(--accent);color:#082f49;font-weight:800;cursor:pointer;text-decoration:none}.secondary{background:transparent;color:var(--text);border:1px solid var(--line)}main{padding:25px 16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px}.turn{padding:13px;border-radius:10px;margin:9px 0;white-space:pre-wrap;line-height:1.55}.facilitator{background:#0c4a6e}.respondent{background:#334155;margin-left:8%}.meta{font-size:12px;color:var(--muted)}textarea,input,select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:11px;font:inherit}textarea{min-height:125px;resize:vertical}.option{display:flex;gap:8px;align-items:center;padding:8px}.option input{width:auto}.status{white-space:pre-wrap}.error{color:var(--bad)}.ok{color:var(--ok)}h1{font-size:22px;color:var(--accent);margin:0 0 5px}footer{text-align:center;color:var(--muted);padding:10px 16px 24px;font-size:12px}</style></head><body><header><div class="head"><div class="brand">🔬 Research OS · <span id="brandText">Diálogo</span></div><div><a class="button secondary" href="cabinet.html" id="backLink">← Panel</a></div></div></header><main><section class="card"><h1 id="title">Diálogo de investigación</h1><div id="meta" class="meta"></div></section><section class="card"><div id="turns"></div><div id="responseEditor"></div><div id="pageStatus" class="status"></div></section><section class="card"><button class="secondary" onclick="exitDialogue()" id="exitButton">Interrumpir esta sesión</button></section></main><footer>✨ CRM Sharks &amp; Ray AI | Research OS Pilot</footer><script src="auth.js"></script><script>
'use strict';const COPY={es:{brand:'Diálogo',back:'← Panel',title:'Diálogo de investigación',send:'Enviar respuesta',exit:'Interrumpir esta sesión',complete:'La sesión de diálogo ha finalizado.',working:'Procesando la respuesta…',error:'No se pudo continuar el diálogo.',text:'Escriba su respuesta'},en:{brand:'Dialogue',back:'← Hub',title:'Research dialogue',send:'Send response',exit:'Interrupt this session',complete:'The dialogue session is complete.',working:'Processing response…',error:'The dialogue could not continue.',text:'Write your response'},ru:{brand:'Диалог',back:'← Кабинет',title:'Исследовательский диалог',send:'Отправить ответ',exit:'Прервать эту сессию',complete:'Сессия диалога завершена.',working:'Обрабатываем ответ…',error:'Не удалось продолжить диалог.',text:'Напишите ответ'}};let lang='es',principal=null,session=null,busy=false;const id=new URLSearchParams(location.search).get('dialogue_session_id')||'',esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function headers(extra){return ResearchAuth.authHeaders('respondent',extra||{})}async function request(url,options){const r=await fetch(url,options),d=await r.json();if(!r.ok)throw new Error(d.error||r.status);return d}function applyCopy(){const t=COPY[lang];document.documentElement.lang=lang;brandText.textContent=t.brand;backLink.textContent=t.back;title.textContent=session?.title||t.title;exitButton.textContent=t.exit}async function load(){try{const data=await request(`/api/respondent/dialogue-sessions/${encodeURIComponent(id)}`,{headers:headers()});session=data.session;applyCopy();render()}catch(e){error(e)}}function render(){turns.innerHTML=(session.turns||[]).map(turn=>`<div class="turn ${turn.speaker==='respondent'?'respondent':'facilitator'}">${esc(turn.content)}<div class="meta">${esc(turn.speaker)} · ${turn.ordinal}</div></div>`).join('');meta.textContent=`${session.dialogue_type} · ${session.protocol_id} · v${session.protocol_version} · ${session.started_at}`;if(session.status==='completed'){responseEditor.innerHTML=`<div class="ok">${esc(COPY[lang].complete)}</div>`;exitButton.hidden=true;return}const node=session.current_node||{response_type:'text',options:[]},type=node.response_type||'text';let editor='';if(type==='text')editor=`<textarea id="responseValue" placeholder="${esc(COPY[lang].text)}"></textarea>`;else if(type==='numeric')editor='<input id="responseValue" type="number">';else editor=`<div id="responseOptions">${(node.options||[]).map(o=>`<label class="option"><input name="responseOption" type="${type==='multiple_select'?'checkbox':'radio'}" value="${esc(o.value)}"> <span>${esc(o.label)}</span></label>`).join('')}</div>`;responseEditor.innerHTML=editor+`<button style="margin-top:12px" onclick="submitResponse()">${esc(COPY[lang].send)}</button>`}function responseValue(){const type=session.current_node?.response_type||'text';if(type==='numeric')return Number(document.getElementById('responseValue').value);if(type==='single_select')return document.querySelector('[name=responseOption]:checked')?.value;if(type==='multiple_select')return [...document.querySelectorAll('[name=responseOption]:checked')].map(x=>x.value);return document.getElementById('responseValue').value.trim()}async function submitResponse(){if(busy)return;const value=responseValue();if(value===''||value===undefined||value===null||(Array.isArray(value)&&!value.length))return;busy=true;pageStatus.textContent=COPY[lang].working;try{const endpoint=session.dialogue_type==='researcher_scripted'?'scripted-response':'ai-response',data=await request(`/api/respondent/dialogue-sessions/${encodeURIComponent(id)}/${endpoint}`,{method:'POST',headers:headers({'Content-Type':'application/json'}),body:JSON.stringify({response:value})});if(data.status==='completed'){session.status='completed'}await load();pageStatus.textContent=''}catch(e){error(e)}finally{busy=false}}async function exitDialogue(){if(busy)return;busy=true;try{await request(`/api/respondent/dialogue-sessions/${encodeURIComponent(id)}/discard`,{method:'POST',headers:headers({'Content-Type':'application/json'}),body:JSON.stringify({reason:'respondent_exit'})});location.replace('cabinet.html')}catch(e){error(e);busy=false}}function error(e){pageStatus.textContent=`${COPY[lang].error} ${e.message}`;pageStatus.className='status error'}document.addEventListener('DOMContentLoaded',async()=>{lang=localStorage.getItem('app_language')||'es';if(!COPY[lang])lang='es';applyCopy();principal=await ResearchAuth.requireRole('respondent',`dialogue.html?dialogue_session_id=${encodeURIComponent(id)}`);if(!principal)return;await load()});</script></body></html>
