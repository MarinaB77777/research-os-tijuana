<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Research OS | Анкета</title>
  <style>
    :root{--bg:#0f172a;--panel:#1e293b;--inner:#111c30;--line:#334155;--accent:#38bdf8;--text:#f8fafc;--muted:#94a3b8;--bad:#f87171}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}
    header{background:var(--panel);border-bottom:1px solid var(--line);padding:13px 22px}.head{max-width:820px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:800;color:var(--accent)}
    button{border:0;border-radius:8px;padding:11px 17px;background:var(--accent);color:var(--bg);font-weight:800;cursor:pointer}button:hover{filter:brightness(1.08)}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:transparent;border:1px solid var(--line);color:var(--text)}
    main{max-width:820px;margin:0 auto;padding:28px 18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px}.muted{color:var(--muted);line-height:1.5}.error{color:var(--bad)}h1{font-size:23px;color:var(--accent);margin:0 0 8px}h2{font-size:19px;margin:0 0 18px;line-height:1.4}.progress{height:8px;background:var(--inner);border-radius:999px;overflow:hidden;margin:18px 0}.progress>div{height:100%;background:var(--accent);transition:width .2s}
    .question{background:var(--inner);border:1px solid var(--line);border-radius:10px;padding:20px}.code{font-size:11px;color:var(--muted);margin-bottom:8px}.option{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:13px;margin-top:9px;cursor:pointer}.option:hover{border-color:var(--accent)}.option input{margin-top:3px;accent-color:var(--accent)}
    input[type=text],input[type=number],textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:10px;font:inherit}textarea{min-height:150px;resize:vertical;line-height:1.5}input[type=range]{width:100%;margin-top:16px;accent-color:var(--accent)}.range-meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);margin-top:7px;font-size:13px}.range-value{color:var(--accent);font-weight:800}.unit{color:var(--muted);margin-top:7px}.actions{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap}.hidden{display:none!important}
    footer{text-align:center;color:#64748b;border-top:1px solid var(--line);padding:20px;font-size:12px;margin-top:30px}
  </style>
</head>
<body>
<header><div class="head"><div class="brand">🔬 Research OS</div><button class="secondary" onclick="returnToCabinet()" data-i18n="cabinet">← В кабинет</button></div></header>
<main>
  <section class="card">
    <h1 id="title" data-i18n="loading">Загрузка анкеты…</h1>
    <p id="description" class="muted"></p>
    <div id="progressWrap" class="hidden">
      <div class="progress"><div id="progressBar"></div></div>
      <div id="progressText" class="muted"></div>
    </div>
    <div id="questionBlock"></div>
    <div id="status" class="muted"></div>
    <div id="actions" class="actions hidden">
      <button class="secondary" id="backButton" onclick="goBack()" data-i18n="back">Назад</button>
      <button id="nextButton" onclick="goNext()" data-i18n="next">Далее</button>
    </div>
  </section>
</main>
<footer>✨ CRM Sharks · Ray AI | Research OS Pilot</footer>
<script src="auth.js"></script>
<script src="research-contracts.js"></script>
<script>
'use strict';
const RC=window.ResearchContracts;
const T={
 ru:{cabinet:'← В кабинет',loading:'Загрузка анкеты…',back:'Назад',next:'Далее',finish:'Завершить и отправить',progress:'Вопрос',of:'из',loadError:'Анкету не удалось загрузить.',sessionInactive:'Эта сессия уже не активна.',submitError:'Ответы не удалось сохранить.',requiredAnswer:'Ответьте на обязательный вопрос.',invalidValue:'Ответ не соответствует допустимому диапазону или шагу шкалы.',minimumAnswers:'Для завершения недостаточно ответов.',invalidRoute:'Маршрут анкеты некорректен.',submitting:'Сохранение ответов…'},
 es:{cabinet:'← Al panel',loading:'Cargando cuestionario…',back:'Atrás',next:'Siguiente',finish:'Finalizar y enviar',progress:'Pregunta',of:'de',loadError:'No se pudo cargar el cuestionario.',sessionInactive:'Esta sesión ya no está activa.',submitError:'No se pudieron guardar las respuestas.',requiredAnswer:'Responda la pregunta obligatoria.',invalidValue:'La respuesta no respeta el rango o el paso permitido por la escala.',minimumAnswers:'No hay suficientes respuestas para completar.',invalidRoute:'La ruta del cuestionario no es válida.',submitting:'Guardando respuestas…'},
 en:{cabinet:'← Participant hub',loading:'Loading questionnaire…',back:'Back',next:'Next',finish:'Finish and submit',progress:'Question',of:'of',loadError:'The questionnaire could not be loaded.',sessionInactive:'This session is no longer active.',submitError:'The responses could not be saved.',requiredAnswer:'Answer the required question.',invalidValue:'The response is outside the scale range or does not follow its step.',minimumAnswers:'There are not enough answers to complete.',invalidRoute:'The questionnaire route is invalid.',submitting:'Saving responses…'}
};
let lang='ru',principal=null,sessionId=null,collectionSession=null,questionnaire=null,items=[],itemById=new Map(),history=[],currentItemId=null,answers=new Map(),presentedAt=new Map(),sessionFinalized=false,discardRequested=false;
function headers(extra){return ResearchAuth.authHeaders('respondent',extra||{});}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function applyLanguage(){document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(el=>{const v=T[lang][el.dataset.i18n];if(v)el.textContent=v;});}
function localized(value){
 if(value&&typeof value==='object'&&!Array.isArray(value))return value[lang]||value[`${lang}-MX`]||value.es||value.en||value.ru||Object.values(value)[0]||'';
 return value??'';
}
async function request(url,options){const response=await fetch(url,options);const data=await response.json();if(!response.ok)throw new Error(data.error||`${response.status}`);return data;}
async function discardIncompleteSession(){
 if(sessionFinalized||discardRequested||!sessionId||collectionSession?.status!=='active')return;discardRequested=true;
 try{await fetch(`/respondent/sessions/${encodeURIComponent(sessionId)}/discard`,{method:'POST',headers:headers(),keepalive:true});}catch(_error){}
}
async function returnToCabinet(){await discardIncompleteSession();location.href='cabinet.html';}
async function loadSession(){
 try{
  const data=await request(`/respondent/sessions/${encodeURIComponent(sessionId)}`,{headers:headers()});collectionSession=data.session;
  if(collectionSession.status!=='active'){document.getElementById('title').textContent=T[lang].sessionInactive;document.getElementById('description').textContent='';return;}
  questionnaire=collectionSession.questionnaire;items=[...(questionnaire.items||[])].sort((a,b)=>Number(a.position)-Number(b.position));itemById=new Map(items.map(item=>[item.item_id,item]));currentItemId=questionnaire.start_item_id;
  if(!itemById.has(currentItemId))throw new Error('Questionnaire start item is missing');
  document.getElementById('title').textContent=localized(questionnaire.title)||questionnaire.code;document.getElementById('description').textContent=localized(questionnaire.description)||'';
  document.getElementById('progressWrap').classList.remove('hidden');document.getElementById('actions').classList.remove('hidden');renderCurrent();
 }catch(error){document.getElementById('title').textContent=T[lang].loadError;document.getElementById('description').textContent=error.message;document.getElementById('description').className='error';}
}
function renderCurrent(){
 const item=itemById.get(currentItemId);if(!item)return;if(!presentedAt.has(item.item_id))presentedAt.set(item.item_id,new Date().toISOString());const index=items.findIndex(x=>x.item_id===currentItemId),definition=item.definition_snapshot||{},prompt=localized(definition.prompt)||item.code,answer=answers.get(item.item_id)?.value;
 document.getElementById('progressBar').style.width=`${Math.max(1,Math.round(((index+1)/items.length)*100))}%`;document.getElementById('progressText').textContent=`${T[lang].progress} ${index+1} ${T[lang].of} ${items.length}`;document.getElementById('questionBlock').innerHTML=renderQuestion(item,definition,prompt,answer);document.getElementById('backButton').disabled=history.length===0;document.getElementById('nextButton').textContent=isTerminalRoute(item,answer)?T[lang].finish:T[lang].next;document.getElementById('status').textContent='';
}
function renderQuestion(item,q,prompt,answer){
 const type=q.type||'single_select',name=`answer_${item.item_id}`,scale=q.scale||{},scaleId=String(scale.id||'');
 if(['number','numeric','numeric_input'].includes(type)){
  const min=Number.isFinite(Number(scale.min))&&scale.min!==null&&scale.min!==''?Number(scale.min):null,max=Number.isFinite(Number(scale.max))&&scale.max!==null&&scale.max!==''?Number(scale.max):null,step=Number.isFinite(Number(scale.step))&&Number(scale.step)>0?Number(scale.step):'any',unit=scale.unit?`<div class="unit">${escapeHtml(scale.unit)}</div>`:'',attrs=`${min===null?'':` min="${escapeHtml(min)}"`}${max===null?'':` max="${escapeHtml(max)}"`} step="${escapeHtml(step)}"`;
  if(scaleId==='continuous_slider'){
   const sliderMin=min??0,sliderMax=max??100,sliderValue=answer===undefined?sliderMin:answer;
   return `<div class="question"><div class="code">${escapeHtml(item.code)}</div><h2>${escapeHtml(prompt)}</h2><input id="${name}" type="range" min="${escapeHtml(sliderMin)}" max="${escapeHtml(sliderMax)}" step="${escapeHtml(step==='any'?1:step)}" value="${escapeHtml(sliderValue)}" data-touched="${answer===undefined?'false':'true'}" data-unit="${scale.unit?` ${escapeHtml(scale.unit)}`:''}" onpointerdown="this.dataset.touched='true'" oninput="this.dataset.touched='true';document.getElementById('${name}_value').textContent=this.value+this.dataset.unit"><div class="range-meta"><span>${escapeHtml(sliderMin)}</span><span id="${name}_value" class="range-value">${escapeHtml(sliderValue)}${scale.unit?` ${escapeHtml(scale.unit)}`:''}</span><span>${escapeHtml(sliderMax)}</span></div></div>`;
  }
  return `<div class="question"><div class="code">${escapeHtml(item.code)}</div><h2>${escapeHtml(prompt)}</h2><input id="${name}" type="number"${attrs} value="${answer===undefined?'':escapeHtml(answer)}">${unit}</div>`;
 }
 if(['text','text_input'].includes(type)){
  const maxLength=Number.isInteger(q.max_length)&&q.max_length>0?` maxlength="${q.max_length}"`:'';
  if(scaleId==='long_paragraph')return `<div class="question"><div class="code">${escapeHtml(item.code)}</div><h2>${escapeHtml(prompt)}</h2><textarea id="${name}"${maxLength}>${answer===undefined?'':escapeHtml(answer)}</textarea></div>`;
  return `<div class="question"><div class="code">${escapeHtml(item.code)}</div><h2>${escapeHtml(prompt)}</h2><input id="${name}" type="text"${maxLength} value="${answer===undefined?'':escapeHtml(answer)}"></div>`;
 }
 const multiple=['multi_select','multiple_select','multiple_choice'].includes(type),selected=multiple?(Array.isArray(answer)?answer:[]):[answer];
 return `<div class="question"><div class="code">${escapeHtml(item.code)}</div><h2>${escapeHtml(prompt)}</h2>${(q.options||[]).map(option=>{const checked=selected.some(value=>sameValue(value,option.value));return `<label class="option"><input type="${multiple?'checkbox':'radio'}" name="${name}" value="${escapeHtml(JSON.stringify(option.value))}"${checked?' checked':''}><span>${escapeHtml(localized(option.text)||option.label||String(option.value))}</span></label>`;}).join('')}</div>`;
}
function readCurrentAnswer(){
 const item=itemById.get(currentItemId),q=item.definition_snapshot||{},type=q.type||'single_select',name=`answer_${item.item_id}`;let value;
 if(['number','numeric','numeric_input'].includes(type)){const control=document.getElementById(name),raw=control?.value;value=control?.type==='range'&&control.dataset.touched!=='true'||raw===''?undefined:Number(raw);}
 else if(['text','text_input'].includes(type)){const raw=document.getElementById(name)?.value.trim();value=raw||undefined;}
 else if(['multi_select','multiple_select','multiple_choice'].includes(type)){const values=[...document.querySelectorAll(`input[name="${name}"]:checked`)].map(el=>JSON.parse(el.value));value=values.length?values:undefined;}
 else{const selected=document.querySelector(`input[name="${name}"]:checked`);value=selected?JSON.parse(selected.value):undefined;}
 if(value===undefined)answers.delete(item.item_id);else{const answeredNow=new Date();answers.set(item.item_id,{value,presented_at:presentedAt.get(item.item_id),answered_at:answeredNow.toISOString(),answered_utc_offset_minutes:-answeredNow.getTimezoneOffset()});}return value;
}
function sameValue(a,b){return JSON.stringify(a)===JSON.stringify(b);}
function hasAnswer(value){return value!==undefined&&value!==null&&!(typeof value==='string'&&value.trim()==='')&&!(Array.isArray(value)&&value.length===0);}
function resolvedTarget(item,answer){
 const node=questionnaire.routing?.nodes?.[item.item_id]||{},rule=(node.rules||[]).find(candidate=>candidate.operator==='equals'&&(Array.isArray(answer)?answer.some(value=>sameValue(value,candidate.value)):sameValue(answer,candidate.value)));return rule?.target||node.default_target||'next';
}
function nextInOrder(itemId){const index=items.findIndex(item=>item.item_id===itemId);return index>=0&&index+1<items.length?items[index+1].item_id:'end';}
function resolvedNext(item,answer){const target=resolvedTarget(item,answer);return target==='next'?nextInOrder(item.item_id):target;}
function isTerminalRoute(item,answer){return resolvedNext(item,answer)==='end';}
async function goNext(){
 const item=itemById.get(currentItemId),answer=readCurrentAnswer(),target=resolvedNext(item,answer);
 const answerControl=document.getElementById(`answer_${item.item_id}`);if(answerControl&&!answerControl.checkValidity()){document.getElementById('status').textContent=T[lang].invalidValue;document.getElementById('status').className='error';answerControl.focus();return;}
 if(item.required!==false&&!hasAnswer(answer)){document.getElementById('status').textContent=T[lang].requiredAnswer;document.getElementById('status').className='error';return;}
 if(target==='end'){await submitAll();return;}
 if(!itemById.has(target)){document.getElementById('status').textContent='Invalid route target';document.getElementById('status').className='error';return;}
 if(history.includes(target)||target===currentItemId){document.getElementById('status').textContent=T[lang].invalidRoute;document.getElementById('status').className='error';return;}
 history.push(currentItemId);currentItemId=target;renderCurrent();
}
function goBack(){readCurrentAnswer();const previous=history.pop();if(previous){currentItemId=previous;renderCurrent();}}
async function submitAll(){
 const routeItemIds=[...history,currentItemId],activePath=new Set(routeItemIds),minimumAnswered=Number(questionnaire.completion_policy?.minimum_answered_items||1),routeAnswers=routeItemIds.filter(itemId=>hasAnswer(answers.get(itemId)?.value));
 if(routeItemIds.some(itemId=>itemById.get(itemId)?.required!==false&&!hasAnswer(answers.get(itemId)?.value))){document.getElementById('status').textContent=T[lang].requiredAnswer;document.getElementById('status').className='error';return;}
 if(routeAnswers.length<minimumAnswered){document.getElementById('status').textContent=`${T[lang].minimumAnswers} (${routeAnswers.length}/${minimumAnswered})`;document.getElementById('status').className='error';return;}
 const button=document.getElementById('nextButton');button.disabled=true;document.getElementById('backButton').disabled=true;document.getElementById('status').textContent=T[lang].submitting;document.getElementById('status').className='muted';
 const finishedAt=new Date().toISOString(),records=[];
 answers.forEach((answer,itemId)=>{if(!activePath.has(itemId))return;const item=itemById.get(itemId),q=item.definition_snapshot||{};records.push({response_id:RC.createUuid(),session_id:sessionId,participant_id:principal.user_identifier,questionnaire_item_id:item.item_id,bank_id:item.source_bank_id,bank_version:item.source_bank_version,question_id:item.question_id,question_version:item.question_version,code:item.code,value:answer.value,scale:q.scale||null,presented_at:answer.presented_at,answered_at:answer.answered_at,answered_utc_offset_minutes:answer.answered_utc_offset_minutes,global_time_reference:collectionSession.global_time_reference});});
 const identity={source_instance_id:RC.createUuid(),session_id:sessionId,participant_id:principal.user_identifier,subject_link_id:collectionSession.subject_link_id||null,enrollment_id:collectionSession.enrollment_id||null,participant_measurement_id:collectionSession.participant_measurement_id||null,study_id:collectionSession.study_id||null,study_version:collectionSession.study_version||null,group_membership_id:collectionSession.group_membership_id||null,group_id:collectionSession.group_id||null,group_code:collectionSession.group_code||null,timepoint_id:collectionSession.timepoint_id||null,timepoint_code:collectionSession.timepoint_code||null,timepoint_ordinal:collectionSession.timepoint_ordinal||null,study_questionnaire_assignment_id:collectionSession.study_questionnaire_assignment_id||null,domain_id:'questionnaire',source_type:'self_report',data_structure_type:'questionnaire',data_source_path:`${questionnaire.questionnaire_id}:${questionnaire.version}`,questionnaire_id:questionnaire.questionnaire_id,questionnaire_version:questionnaire.version,route_item_ids:routeItemIds,completion_policy_snapshot:{minimum_answered_items:minimumAnswered,require_terminal_route:true},collection_started_at:collectionSession.started_at,collection_finished_at:finishedAt,global_time_reference:collectionSession.global_time_reference,client_time_zone:Intl.DateTimeFormat().resolvedOptions().timeZone||null};
 try{await request(`/pilot/sessions/${encodeURIComponent(sessionId)}/answers`,{method:'POST',headers:headers({'Content-Type':'application/json'}),body:JSON.stringify({domain_data_identity:identity,response_records:records})});sessionFinalized=true;location.href=`cabinet.html?completed=${encodeURIComponent(sessionId)}`;}catch(error){button.disabled=false;document.getElementById('backButton').disabled=history.length===0;document.getElementById('status').textContent=`${T[lang].submitError} ${error.message}`;document.getElementById('status').className='error';}
}
window.addEventListener('pagehide',()=>{void discardIncompleteSession();});
document.addEventListener('DOMContentLoaded',async()=>{principal=await ResearchAuth.requireRole('respondent','assessment.html');if(!principal)return;lang=localStorage.getItem('app_language')||'ru';if(!T[lang])lang='ru';applyLanguage();sessionId=new URLSearchParams(location.search).get('session_id');if(!sessionId){document.getElementById('title').textContent=T[lang].loadError;document.getElementById('description').textContent='session_id is required';return;}await loadSession();});
</script>
</body>
</html>
